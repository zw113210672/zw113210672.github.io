<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>交易记录归档 - 量学交易记录</title>
  <meta name="description" content="量学交易记录每日归档">
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>

<nav class="navbar">
  <a href="/" class="nav-brand">📊 量学<span>交易记录</span></a>
  <div class="nav-links">
    <a href="/">首页</a>
    <a href="/records/">归档</a>
  </div>
</nav>

<div class="container">

  <div class="detail-header">
    <a href="/" class="back-link">← 返回首页</a>
    <h1>📚 交易记录归档</h1>
    <p class="detail-date">每日收盘后自动生成记录</p>
  </div>

  <div class="scan-results">
    <div id="archive-content">
      <!-- 由 generate_site.py 填充 -->
    </div>
  </div>

</div>

<div class="footer">
  <p>📊 量学交易记录 · 基于黑马王子量学理论 · 仅供参考，不构成投资建议</p>
  <p style="margin-top: 4px;">Generated by Hermes Agent</p>
</div>

<script>
fetch('/records/index.json')
  .then(r => r.json())
  .then(data => {
    const container = document.getElementById('archive-content');
    if (!data.latest || data.latest.length === 0) {
      container.innerHTML = '<div class="empty-state"><div class="icon">📭</div><h3>暂无记录</h3><p>收盘扫描完成后会自动生成</p></div>';
      return;
    }
    container.innerHTML = `<h2>共 ${data.totalDays} 条记录</h2><div class="archive-list">` +
      data.latest.map(day => `
        <a href="/records/${day.date}.html" class="archive-item">
          <div class="date">${day.date}</div>
          <div class="count">${(day.stocks || []).length} 只</div>
        </a>
      `).join('') +
      '</div>';
  })
  .catch(() => {
    document.getElementById('archive-content').innerHTML = '<div class="empty-state"><div class="icon">📭</div><h3>暂无记录</h3><p>收盘扫描完成后会自动生成</p></div>';
  });
</script>

</body>
</html>
